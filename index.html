<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="用電影與音訊學英文 — 雙語字幕、跟讀、生詞本（English + 繁體中文）" />
  <title>影音英語學習｜Media English Study</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- styles loaded by app.js from media-english-study CDN; local fallback -->
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo"><span class="logo-icon" aria-hidden="true">🎬</span><span>影音英語學習</span></div>
      <div class="header-actions">
        <button type="button" class="btn" id="btnVocab" title="生詞本">生詞本 <span class="badge" id="vocabBadge" style="display:none">0</span></button>
        <button type="button" class="btn btn-ghost" id="btnShortcuts" title="快捷鍵">⌨️ 快捷鍵</button>
      </div>
    </header>
    <div class="sample-bar">
      <span>💡 可先載入示範字幕試用介面。靜態 Pages 無 YouTube API — 請用已部署的後端站。</span>
      <button type="button" class="btn btn-sm btn-primary" id="btnLoadSample">載入示範字幕</button>
    </div>
    <main class="main" id="mainMount">
      <p class="hint" style="padding:1rem">載入應用中…</p>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="./app.js" defer></script>
</body>
</html>
